name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push cancels the first: nobody needs the results of a commit that
# has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The bundle size is quoted on the landing page, so it is checked here
      # rather than discovered by a reader.
      - name: Bundle budget
        run: node scripts/size.mjs

      - name: Site builds, with no dead links
        run: |
          pnpm --filter @matra/site build
          node scripts/links.mjs
