name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push cancels the first: nobody needs the results of a commit that
# has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: package.json's packageManager field is the one source,
      # and specifying both is an error rather than a preference.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The suite runs against src through a Vitest alias, so nothing else here
      # ever loads what is actually published: the exports map, the file list,
      # the CJS build. A package that imports and refuses to require is a broken
      # release that every green tick above would have waved through.
      - name: The packages load as published
        run: node scripts/packaging.mjs

      # The bundle size is quoted on the landing page, so it is checked here
      # rather than discovered by a reader. `--check` also refuses a committed
      # sizes.json that nobody regenerated: a number the site prints and the
      # bundler disagrees with is worse than no number.
      - name: Bundle budget
        run: node scripts/size.mjs --check

      - name: Site builds, with no dead links
        run: |
          pnpm --filter @matra/site build
          node scripts/links.mjs

      # A script asking for an element the markup does not have is not a type
      # error and not a dead link, so nothing else here would notice. The chat
      # demo's send button was dead for exactly that reason.
      - name: Site wiring
        run: node scripts/wiring.mjs

      # Speed is the claim this project is sold on, so a regression fails here
      # rather than being noticed by a user with a long document. Compared in
      # calibrated units — a figure divided by one unit of ordinary work
      # measured in the same process — because absolute milliseconds on a
      # shared CI vCPU mean nothing next to a laptop's.
      - name: Performance ratchet
        run: node bench/bench.mjs --check
