<!doctype html>
<html><head><meta charset="utf-8"><title>Matra, Tiptap, Lexical, Slate</title>
<style>body{font:12px ui-monospace,Menlo,monospace;padding:16px;background:#111;color:#eee}pre{white-space:pre-wrap}</style>
</head><body>
<pre id="out">running…</pre>
<script>
  // Without this a thrown error leaves "running…" on screen and the run looks
  // like it is still going, which is how a broken harness gets read as a slow one.
  window.addEventListener('error', (e) => {
    document.getElementById('out').textContent = 'ERROR: ' + ((e.error && e.error.stack) || e.message)
  })
  window.addEventListener('unhandledrejection', (e) => {
    document.getElementById('out').textContent = 'REJECT: ' + ((e.reason && e.reason.stack) || e.reason)
  })
</script>
<script type="module" src="./bench.js"></script>
</body></html>
